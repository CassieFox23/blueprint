<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Blueprint teaser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* A half-minute teaser, 1920×1080, driven frame by frame through window.setTime(seconds). */
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1d4b8a}
body{font-family:'Instrument Sans',sans-serif;color:#fff;position:relative;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:40px 40px}
.layer{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
/* 1 prompt */
.prompt{width:1240px;height:120px;border-radius:26px;background:#fff;display:flex;align-items:center;padding:0 44px;gap:22px;box-shadow:0 40px 90px -40px rgba(0,0,0,.6);color:#0d1b2e;transform-origin:50% 50%}
.prompt b{font:600 44px 'IBM Plex Mono',monospace;color:#1d4b8a}
#typed{font:500 44px 'IBM Plex Mono',monospace;white-space:pre}
#typed i{font-style:normal;display:inline-block}
.caret{display:inline-block;width:25px;height:54px;background:#1d4b8a;margin-left:5px;vertical-align:-12px;border-radius:2px}
.hint{margin-top:36px;font:500 23px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#bdd0ee}
/* 2 + 4 sheet stage */
#stage{justify-content:flex-start}
.sheets{position:absolute;left:50%;top:54px;width:1356px;height:840px;margin-left:-678px}
.sheets>div{position:absolute;inset:0;opacity:0}
.sheets .bp-svg{border-radius:10px;box-shadow:0 50px 100px -50px rgba(0,0,0,.7)}
.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-.01em;padding:0 140px;line-height:1.2}
.cap.title{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:64px;bottom:44px}
/* 3 title */
.big{font-family:'Instrument Serif',serif;font-size:190px;line-height:.92;letter-spacing:-.025em;text-align:center}
.big em{display:block;color:#ffcf4a}
/* 6 end */
.end svg{width:150px;height:150px}
.end h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:250px;line-height:.9;letter-spacing:-.03em;margin:26px 0 44px}
.pill{background:#ffcf4a;color:#1a1300;border-radius:20px;padding:26px 40px;font:500 46px 'IBM Plex Mono',monospace}
.url{margin-top:34px;font-size:32px;color:#d9e5f8;letter-spacing:.01em}
</style></head><body>

<div class="layer" id="s1"><div class="prompt"><b>/blueprint</b><span><span id="typed"></span><i class="caret" id="caret"></i></span></div><div class="hint">a skill for Claude Code</div></div>

<div class="layer" id="stage"><div class="sheets" id="sheets"></div><div class="cap" id="cap"></div></div>

<div class="layer" id="s3"><div class="big"><span id="l1">Ask how it works.</span><em id="l2">Get the drawing.</em></div></div>


<div class="layer end" id="s6">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7.5" fill="#fff"/><path id="lg1" d="M10.6 26 L15.9 5.6" pathLength="1" stroke-dasharray="1" fill="none" stroke="#1d4b8a" stroke-width="2.8" stroke-linecap="round"/><circle id="lg2" cx="18.6" cy="19.6" r="5.55" pathLength="1" stroke-dasharray="1" fill="none" stroke="#1d4b8a" stroke-width="2.8" transform="rotate(180 18.6 19.6)"/><circle id="dot" cx="18.6" cy="19.6" r="1.9" fill="#ffcf4a"/></svg>
  <h1>/blueprint</h1>
  <div class="pill">npx skills add intincrab/blueprint</div>
  <div class="url">blueprint-skill.vercel.app</div>
</div>

<script src="../runtime/blueprint.js"></script>
<script src="../examples/small/cache.js"></script>
<script src="../examples/small/debounce.js"></script>
<script src="../examples/small/rate-limit.js"></script>
<script src="../examples/small/queue.js"></script>
<script src="../examples/small/hash-map.js"></script>
<script src="../examples/small/load-balancer.js"></script>
<script src="../examples/small/mutex.js"></script>
<script src="../examples/small/retry-backoff.js"></script>
<script src="../examples/complex/emudhra.js"></script>
<script src="../examples/complex/event-loop.js"></script>
<script src="../examples/complex/llm.js"></script>
<script src="../examples/complex/git-merge.js"></script>
<script src="../examples/complex/url.js"></script>
<script src="../examples/complex/cdn.js"></script>
<script src="../examples/complex/circuit-breaker.js"></script>
<script src="../examples/complex/compiler.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const win = (t, a, b, f = .3) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));   // fade in and out

// shots on the sheet stage: [scene id, start, end, scene-time from, scene-time to, caption mode]
const S = BLUEPRINT.scenes, mk = {};
function mount(id) { const d = document.createElement('div'); $('sheets').appendChild(d); const c = BLUEPRINT.mount(d, S[id], { play: 'still', controls: false }); mk[id] = { el: d, c, tl: c.timeline }; return mk[id]; }
['cache', 'emudhra', 'event-loop', 'llm', 'git-merge'].forEach(mount);
const st = (id, i) => mk[id].tl.steps[i].a;
const T = window.TIMING || (() => {          // fallback when rendered without a music file: 120 BPM, fast typing
  const keys = []; let t = 0.3; 'how a cache works'.split('').forEach((c, i) => { keys.push(t); t += 0.045 + (i % 3) * 0.008 + (c === ' ' ? 0.03 : 0); });
  return { beat: 0.5, beats: 50, text: 'how a cache works', keys, enter: 1.5 };
})();
const B = T.beat, bt = n => n * B;                       // every cut sits on a beat of the music
// Beat map (50 beats ≈ 25 s at ~120 BPM): prompt 0-4 · cache 4-20 · line 20-24 · four cuts 24-40 · end 40-50
const P = 4, C = 20, LN = 24, END = 40;
const SHOTS = [
  { id: 'cache', a: bt(P), b: bt(12), from: st('cache', 1) - 0.3, to: st('cache', 3) - 0.2, cap: 'steps', fin: true },
  { id: 'cache', a: bt(12), b: bt(C), from: st('cache', 5) - 0.2, to: mk.cache.tl.total - 0.4, cap: 'steps', fout: true },
  { id: 'emudhra', a: bt(LN), b: bt(LN + 4), from: st('emudhra', 3) + 1.2, to: st('emudhra', 5) + 0.6, cap: 'The eMudhra key compromise', fin: true },
  { id: 'event-loop', a: bt(LN + 4), b: bt(LN + 8), from: st('event-loop', 3), to: st('event-loop', 3) + 6, cap: 'The JavaScript event loop' },
  { id: 'llm', a: bt(LN + 8), b: bt(LN + 12), from: st('llm', 2), to: st('llm', 2) + 6, cap: 'How a language model writes' },
  { id: 'git-merge', a: bt(LN + 12), b: bt(END), from: st('git-merge', 2), to: st('git-merge', 2) + 6, cap: 'How git merges two branches', fout: true }
];
const typed = $('typed');
T.text.split('').forEach(ch => { const i = document.createElement('i'); i.textContent = ch; typed.appendChild(i); });
const chars = [...typed.children];

window.DURATION = T.beats * B;
window.setTime = t => {
  // 1 · the prompt, typed like a typewriter: each key lands with a small strike
  $('s1').style.opacity = 1 - seg(t, bt(P) - .2, bt(P));
  chars.forEach((el, i) => {
    const dt = t - T.keys[i];
    el.style.display = dt >= 0 ? 'inline-block' : 'none';
    const k = clamp(dt / .06);
    el.style.transform = `translateY(${(1 - k) * -7}px) scale(${1 + (1 - k) * .14})`;
    el.style.opacity = .55 + .45 * k;
  });
  const last = T.keys[T.keys.length - 1];
  const idle = t < T.keys[0] - .05 || (t > last + .12 && t < T.enter);
  $('caret').style.opacity = t >= T.enter ? 0 : (idle ? (Math.floor(t / .22) % 2 ? .25 : 1) : 1);
  const press = t >= T.enter ? Math.sin(Math.PI * clamp((t - T.enter) / .2)) : 0;      // the return key
  document.querySelector('.prompt').style.transform = `scale(${1 - .035 * press})`;
  // 2 + 4 · sheets
  let any = 0, cap = '', title = false;
  for (const id in mk) mk[id].el.style.opacity = 0;
  for (const { id, a, b, from, to, cap: c, fin, fout } of SHOTS) {
    if (t < a || t >= b) continue;
    const m = mk[id], k = (t - a) / (b - a), ts = from + (to - from) * k;
    m.c.seek(ts);
    const o = Math.min(fin ? seg(t, a, a + .22) : 1, fout ? 1 - seg(t, b - .22, b) : 1);
    m.el.style.opacity = o; any = Math.max(any, o);
    m.el.style.transform = `scale(${1 + .03 * k})`;
    if (c === 'steps') { let s = m.tl.steps[0]; for (const x of m.tl.steps) if (x.a <= ts + .001) s = x; cap = s.say.replace(/\s*\(\d+\)/g, ''); }
    else { cap = c; title = true; }
  }
  $('stage').style.opacity = any ? 1 : 0;
  $('cap').textContent = cap; $('cap').className = 'cap' + (title ? ' title' : ''); $('cap').style.opacity = any;
  // 3 · the line, one half per bar
  const a3 = bt(C), b3 = bt(LN);
  $('s3').style.opacity = t >= a3 && t < b3 ? 1 - seg(t, b3 - .18, b3) : 0;
  $('l1').style.cssText = `display:block;opacity:${seg(t, a3, a3 + .3)};transform:translateY(${(1 - seg(t, a3, a3 + .4)) * 34}px)`;
  $('l2').style.cssText = `opacity:${seg(t, a3 + 2 * B - .05, a3 + 2 * B + .3)};transform:translateY(${(1 - seg(t, a3 + 2 * B - .05, a3 + 2 * B + .4)) * 34}px)`;
  // 6 · the end card: the mark is drawn, stem then bowl, and the centre point lands
  const a6 = bt(END), e = seg(t, a6, a6 + .35);
  $('s6').style.opacity = e;
  $('s6').style.transform = `translateY(${(1 - e) * 22}px)`;
  $('lg1').setAttribute('stroke-dashoffset', 1 - seg(t, a6 + .1, a6 + .45));
  $('lg2').setAttribute('stroke-dashoffset', 1 - seg(t, a6 + .4, a6 + .95));
  const d = clamp((t - Math.max(a6 + 1, a6 + 2 * B)) / .3), pop = d < 1 ? 1.7 * Math.sin(Math.PI * d * .62) / Math.sin(Math.PI * .62) : 1;
  $('dot').setAttribute('transform', `translate(18.6 19.6) scale(${d ? Math.max(pop, .001) : 0}) translate(-18.6 -19.6)`);
};
window.ready = document.fonts.ready.then(() => Promise.all(['400 40px "Instrument Serif"', 'italic 400 40px "Instrument Serif"', '500 40px "Instrument Sans"', '500 40px "IBM Plex Mono"', '400 12px "IBM Plex Mono"'].map(f => document.fonts.load(f)))).then(() => { setTime(0); return true; });
</script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Blueprint teaser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* A 30-second teaser, 1920×1080, driven frame by frame through window.setTime(seconds). */
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1d4b8a}
body{font-family:'Instrument Sans',sans-serif;color:#fff;position:relative;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:40px 40px}
.layer{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
/* 1 prompt */
.prompt{width:1180px;height:112px;border-radius:24px;background:#fff;display:flex;align-items:center;padding:0 40px;gap:20px;box-shadow:0 40px 90px -40px rgba(0,0,0,.6);font-size:46px;color:#0d1b2e}
.prompt b{font:500 42px 'IBM Plex Mono',monospace;color:#1d4b8a}
.caret{display:inline-block;width:3px;height:52px;background:#0d1b2e;margin-left:4px;vertical-align:-9px}
.hint{margin-top:34px;font:500 22px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#bdd0ee}
/* 2 + 4 sheet stage */
#stage{justify-content:flex-start}
.sheets{position:absolute;left:50%;top:54px;width:1356px;height:840px;margin-left:-678px}
.sheets>div{position:absolute;inset:0;opacity:0}
.sheets .bp-svg{border-radius:10px;box-shadow:0 50px 100px -50px rgba(0,0,0,.7)}
.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-.01em;padding:0 140px;line-height:1.2}
.cap.title{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:64px;bottom:44px}
/* 3 title */
.big{font-family:'Instrument Serif',serif;font-size:190px;line-height:.92;letter-spacing:-.025em;text-align:center}
.big em{display:block;color:#ffcf4a}
/* 5 wall */
.wall{position:absolute;inset:-60px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px;padding:26px;align-content:center}
.wall .bp-svg{border-radius:6px}
#wallText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.shade{position:absolute;inset:0;background:rgba(18,48,92,.78)}
/* 6 end */
.end svg{width:132px;height:132px}
.end h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:250px;line-height:.9;letter-spacing:-.03em;margin:26px 0 44px}
.pill{background:#ffcf4a;color:#1a1300;border-radius:20px;padding:26px 40px;font:500 46px 'IBM Plex Mono',monospace}
.url{margin-top:34px;font-size:32px;color:#d9e5f8;letter-spacing:.01em}
</style></head><body>

<div class="layer" id="s1"><div class="prompt"><b>/blueprint</b><span><span id="typed"></span><i class="caret" id="caret"></i></span></div><div class="hint">a skill for Claude Code</div></div>

<div class="layer" id="stage"><div class="sheets" id="sheets"></div><div class="cap" id="cap"></div></div>

<div class="layer" id="s3"><div class="big"><span id="l1">Ask how it works.</span><em id="l2">Get the drawing.</em></div></div>

<div class="layer" id="s5"><div class="wall" id="wall"></div><div class="shade"></div><div id="wallText"><div class="big" style="font-size:170px">21 sheets.<em>One skill.</em></div></div></div>

<div class="layer end" id="s6">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7.5" fill="#fff"/><rect x="5.25" y="5.25" width="21.5" height="21.5" rx="1.5" fill="none" stroke="#1d4b8a" stroke-opacity=".5" stroke-width="1.2"/><path d="M10.5 22.5 L19 10.6" fill="none" stroke="#1d4b8a" stroke-width="2.8" stroke-linecap="round"/><circle id="dot" cx="21.2" cy="8.9" r="3" fill="#ffcf4a"/></svg>
  <h1>/blueprint</h1>
  <div class="pill">npx skills add intincrab/blueprint</div>
  <div class="url">blueprint-skill.vercel.app</div>
</div>

<script src="../runtime/blueprint.js"></script>
<script src="../examples/small/cache.js"></script>
<script src="../examples/small/debounce.js"></script>
<script src="../examples/small/rate-limit.js"></script>
<script src="../examples/small/queue.js"></script>
<script src="../examples/small/hash-map.js"></script>
<script src="../examples/small/load-balancer.js"></script>
<script src="../examples/small/mutex.js"></script>
<script src="../examples/small/retry-backoff.js"></script>
<script src="../examples/complex/emudhra.js"></script>
<script src="../examples/complex/event-loop.js"></script>
<script src="../examples/complex/llm.js"></script>
<script src="../examples/complex/git-merge.js"></script>
<script src="../examples/complex/url.js"></script>
<script src="../examples/complex/cdn.js"></script>
<script src="../examples/complex/circuit-breaker.js"></script>
<script src="../examples/complex/compiler.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const win = (t, a, b, f = .3) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));   // fade in and out

// shots on the sheet stage: [scene id, start, end, scene-time from, scene-time to, caption mode]
const S = BLUEPRINT.scenes, mk = {};
function mount(id) { const d = document.createElement('div'); $('sheets').appendChild(d); const c = BLUEPRINT.mount(d, S[id], { play: 'still', controls: false }); mk[id] = { el: d, c, tl: c.timeline }; return mk[id]; }
['cache', 'emudhra', 'event-loop', 'llm', 'git-merge'].forEach(mount);
const st = (id, i) => mk[id].tl.steps[i].a;
const SHOTS = [
  ['cache', 4, 14, 0.2, mk.cache.tl.total, 'steps'],
  ['emudhra', 16, 18, st('emudhra', 3) + 1.2, st('emudhra', 5) + 0.4, 'The eMudhra key compromise'],
  ['event-loop', 18, 20, st('event-loop', 3), st('event-loop', 3) + 7, 'The JavaScript event loop'],
  ['llm', 20, 22, st('llm', 2), st('llm', 2) + 7, 'How a language model writes'],
  ['git-merge', 22, 24, st('git-merge', 2), st('git-merge', 2) + 7, 'How git merges two branches']
];
// wall of finished sheets
['debounce', 'rate-limit', 'url', 'queue', 'hash-map', 'cdn', 'load-balancer', 'circuit-breaker', 'mutex', 'compiler', 'retry-backoff', 'emudhra'].forEach(id => {
  const d = document.createElement('div'); $('wall').appendChild(d); BLUEPRINT.mount(d, S[id], { play: 'still', controls: false });
});

const TEXT = 'how a cache works';
window.DURATION = 30;
window.setTime = t => {
  // 1 · the prompt
  $('s1').style.opacity = 1 - seg(t, 3.65, 4);   // visible from frame 0: it is the thumbnail
  $('s1').style.transform = `scale(${1 + .02 * seg(t, 0, 4)})`;
  $('typed').textContent = TEXT.slice(0, Math.round(TEXT.length * clamp((t - .8) / 1.7)));
  $('caret').style.opacity = t < 2.6 ? 1 : (Math.floor(t * 2.5) % 2 ? 0 : 1);
  // 2 + 4 · sheets
  let any = 0, cap = '', title = false;
  for (const id in mk) mk[id].el.style.opacity = 0;
  for (const [id, a, b, from, to, mode] of SHOTS) {
    if (t < a || t >= b) continue;
    const m = mk[id], k = (t - a) / (b - a), ts = from + (to - from) * k;
    m.c.seek(ts);
    const o = mode === 'steps' ? win(t, a, b, .35) : Math.min(seg(t, a, a + .18), 1 - seg(t, b - .18, b) * (id === 'git-merge' ? 1 : 0));
    m.el.style.opacity = o; any = Math.max(any, o);
    m.el.style.transform = `scale(${1 + .025 * k})`;
    if (mode === 'steps') { let s = m.tl.steps[0]; for (const x of m.tl.steps) if (x.a <= ts + .001) s = x; cap = s.say.replace(/\s*\(\d+\)/g, ''); }
    else { cap = mode; title = true; }
  }
  $('stage').style.opacity = any ? 1 : 0;
  $('cap').textContent = cap; $('cap').className = 'cap' + (title ? ' title' : ''); $('cap').style.opacity = any;
  // 3 · the line
  $('s3').style.opacity = win(t, 14, 16, .25);
  $('l1').style.cssText = `display:block;opacity:${seg(t, 14.05, 14.4)};transform:translateY(${(1 - seg(t, 14.05, 14.45)) * 30}px)`;
  $('l2').style.cssText = `opacity:${seg(t, 14.55, 14.95)};transform:translateY(${(1 - seg(t, 14.55, 15)) * 30}px)`;
  // 5 · the wall
  $('s5').style.opacity = win(t, 24, 26, .25);
  $('wall').style.transform = `scale(${1.08 - .06 * seg(t, 24, 26)}) translateY(${-20 * seg(t, 24, 26)}px)`;
  // 6 · the end card
  const e = seg(t, 26, 26.6);
  $('s6').style.opacity = e;
  $('s6').style.transform = `translateY(${(1 - e) * 24}px)`;
  const d = seg(t, 26.7, 27.5);
  $('dot').setAttribute('transform', `translate(${(1 - d) * -10.7} ${(1 - d) * 13.6})`);
};
window.ready = document.fonts.ready.then(() => Promise.all(['400 40px "Instrument Serif"', 'italic 400 40px "Instrument Serif"', '500 40px "Instrument Sans"', '500 40px "IBM Plex Mono"', '400 12px "IBM Plex Mono"'].map(f => document.fonts.load(f)))).then(() => { setTime(0); return true; });
</script>
</body></html>
